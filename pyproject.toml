[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pointersearch"
version = "0.1.0"
description = "Ground-station toolkit for drone search and rescue imagery: quick mosaics, anomaly detection and candidate review for the DJI Matrice 4T."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "Pillow>=10.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.24"]
dem = ["rasterio>=1.3"]

[project.scripts]
pointersearch = "pointersearch.cli:main"

[tool.setuptools.packages.find]
include = ["pointersearch*"]

[tool.setuptools.package-data]
"pointersearch.review" = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
